<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aide repas</title>
<meta name="description" content="Prochain repas, menu de la semaine et liste de courses du foyer.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1211" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Repas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Couleurs : clair le jour, sombre quand le téléphone est en mode sombre */
:root{
  --bg:#ffffff; --surface:#f5f6f7; --text:#16181a; --muted:#5f656b; --line:#e6e8ea; --line2:#d5d9dd;
  --accent:#1f7a55; --on-accent:#ffffff; --accent-soft:#e6f2ec; --accent-soft-text:#1f7a55;
  --ink:#16181a; --on-ink:#ffffff; --outline:#c3c8cd; --cb:#8c939a; --warn:#8a5a00; --danger:#b42318;
  --snack-action:#7fd6ac; --scrim:rgba(22,24,26,.5); --shadow:0 1px 2px rgba(22,24,26,.12);
  --page:#f3f4f1; --card:#ffffff; --tm:100%;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1211; --surface:#1a1f1d; --text:#eceeed; --muted:#9aa29f; --line:#2a302e; --line2:#3a4240;
  --accent:#4fbf8b; --on-accent:#0f1211; --accent-soft:#16322a; --accent-soft-text:#7fd6ac;
  --ink:#eceeed; --on-ink:#0f1211; --outline:#4a524f; --cb:#7a837f; --warn:#e3b341; --danger:#ff7b72;
  --snack-action:#1f7a55; --scrim:rgba(0,0,0,.6); --shadow:none;
  --page:#0f1211; --card:#1a1f1d; --tm:45%;
}}
:root[data-theme="dark"]{
  --bg:#0f1211; --surface:#1a1f1d; --text:#eceeed; --muted:#9aa29f; --line:#2a302e; --line2:#3a4240;
  --accent:#4fbf8b; --on-accent:#0f1211; --accent-soft:#16322a; --accent-soft-text:#7fd6ac;
  --ink:#eceeed; --on-ink:#0f1211; --outline:#4a524f; --cb:#7a837f; --warn:#e3b341; --danger:#ff7b72;
  --snack-action:#1f7a55; --scrim:rgba(0,0,0,.6); --shadow:none;
  --page:#0f1211; --card:#1a1f1d; --tm:45%;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 "Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.nonav{padding-bottom:0}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:17px;height:17px;stroke-width:2}
svg.i.xs{width:14px;height:14px;stroke-width:2.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--surface);cursor:pointer;min-height:44px}
button:disabled{opacity:.45;cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:inherit;border-radius:14px;min-height:48px;padding:0 16px;font-weight:600}
.btn.big{min-height:52px;font-size:16px}
.primary{background:var(--accent);color:var(--on-accent);font-weight:600}
.outline{background:transparent;border:1px solid var(--line2);font-weight:600}
button.ghost{background:transparent;color:var(--accent);font-weight:600;padding:8px 10px}
.iconbtn{width:44px;height:44px;padding:0;display:grid;place-items:center;border:1px solid var(--line);background:var(--bg);border-radius:12px;flex:none}
.iconbtn.round{border-radius:22px;background:var(--surface)}
.del{background:none;color:var(--muted);min-width:44px;padding:0}
input,select,textarea{font:inherit;width:100%;padding:11px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--bg);color:var(--text);min-height:48px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea{min-height:84px;resize:vertical}
label.l{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.sub{font-size:14px;color:var(--muted)}
.hint,.small{font-size:14px;color:var(--muted)}
.center{text-align:center}
.hidden{display:none !important}
.empty{color:var(--muted);text-align:center;padding:48px 10px 8px;line-height:1.5}
.empty b{color:var(--text);font-size:17px}
.err{color:var(--danger);font-size:14px;margin-top:8px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}

/* En-têtes */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px}
.top h1{font-size:28px;margin:0;font-weight:600;letter-spacing:-.02em}
.top .date{font-size:15px;font-weight:500;color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-weight:600;padding:0}
.subh{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:0 20px 4px;font-size:15px;color:var(--muted)}
.subh b{color:var(--text);font-weight:600}
main{padding:8px 20px 28px;max-width:640px;margin:0 auto}
.subh,.top{max-width:640px;margin-left:auto;margin-right:auto}

/* Étiquettes */
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap}
.tag.ok{background:var(--accent-soft);color:var(--accent-soft-text);font-weight:600}
.tag.ink{background:var(--ink);color:var(--on-ink);font-weight:600}
.tag.line{background:transparent;border:1px solid var(--outline);font-weight:600}
.tag.ev{background:transparent;color:var(--accent);font-weight:600;padding:0 2px}
.tag.sm{height:24px;padding:0 8px;font-size:12px;border-radius:7px;gap:5px}
.tag.sm svg.i{width:13px;height:13px}
.meta{font-size:14px;color:var(--muted);padding-left:2px}

/* Accueil */
.eyebrow{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--accent)}
.hero h2{font-size:32px;line-height:1.1;font-weight:600;letter-spacing:-.02em;margin:12px 0 14px}
.note{font-size:15px;line-height:1.45;color:var(--muted);margin:14px 0 0}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two.one{grid-template-columns:1fr}
.sect{border-top:1px solid var(--line);padding-top:16px;margin-top:24px}
.sect-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sect-h h3{margin:0;font-size:15px;font-weight:600;color:var(--muted)}
.link{color:var(--accent);font-weight:600;font-size:14px;background:none;padding:0 2px}
.next-t{font-size:18px;font-weight:600;line-height:1.25;margin:2px 0 8px}
.box{background:var(--surface);border-radius:16px;padding:16px;margin-top:24px}
.box h3{margin:0 0 2px;font-size:16px;font-weight:600}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.trio button{background:var(--bg);border:1px solid var(--line2);font-weight:600;font-size:15px;padding:8px 4px}
.banner{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--accent-soft);color:var(--accent-soft-text);border-radius:16px;padding:14px 16px;margin-top:24px;font-size:14px;line-height:1.35}
.banner b{display:block;font-size:15px}

/* Semaine */
.day{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day.today{background:var(--accent-soft);border-radius:16px;border-top:0;margin:0 -12px 2px;padding:14px 12px}
.day.today + .day{border-top:0}
.dn{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.dd{font-size:24px;font-weight:600;line-height:1.1}
.day.today .dn,.day.today .dd,.todayl{color:var(--accent-soft-text)}
.todayl{font-size:13px;font-weight:600}
.day.today .tag.ok,.day.today .tag:not(.ink):not(.line):not(.ev){background:var(--bg)}
.dbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.meal{display:flex;gap:10px;align-items:flex-start}
.meal .slot{width:36px;flex:none;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding-top:13px}
.meal .mb{flex:1;min-width:0;text-align:left;background:none;padding:10px 0;border-radius:8px;min-height:44px}
.meal .t{display:block;font-size:16px;font-weight:600;line-height:1.3}
.meal .m{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
.meal.past .t{color:var(--muted)}
.meal .rec{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--accent);border-radius:12px;margin-top:2px}
.swapped{color:var(--accent-soft-text);font-weight:600;white-space:nowrap}
.swapped svg.i{vertical-align:-2px}

/* Courses : un magasin à la fois, rayons en cartes, ajout dans une feuille */
html.grey,html.grey body,html.grey .top{background:var(--page)}
body.withadd{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
body.withadd .snack{bottom:calc(140px + env(safe-area-inset-bottom))}
main.courses{display:flex;flex-direction:column;gap:14px;padding:4px 16px 20px}
main.courses>.empty{padding:24px 10px 4px}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0 0}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.find{position:relative;margin:14px 0 4px}
main.courses .find{margin:0}
.find>.i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.find input{padding-left:42px;padding-right:46px;background:var(--surface);border-color:transparent}
main.courses .find input{background:var(--card);border-color:var(--line)}
.find input::-webkit-search-cancel-button{display:none}
.find .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:transparent;min-height:40px;min-width:40px;padding:0;color:var(--muted);display:grid;place-items:center}
.an mark{background:color-mix(in srgb,var(--accent) 25%,transparent);color:inherit;border-radius:3px}
.addbtn{width:48px;height:48px;flex:none;padding:0;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);border-radius:12px}
.noted{font-size:14px;line-height:1.45;color:var(--muted);margin:10px 0 0}
.noted b{color:var(--text);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{min-height:40px;padding:6px 12px;font-size:14px;border-radius:999px;background:var(--bg);border:1px solid var(--line2)}
.chips button.on{background:var(--accent-soft);color:var(--accent-soft-text);border-color:transparent;font-weight:600}
#mqhh button{display:inline-flex;align-items:center;gap:6px}
.seg{display:grid;grid-auto-columns:minmax(0,1fr);grid-auto-flow:column;gap:4px;background:var(--surface);border-radius:12px;padding:4px;margin:18px 0 4px}
.seg button{background:transparent;min-height:40px;padding:6px;border-radius:9px;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--bg);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.seg.mini{margin:0;flex:none;padding:3px;gap:2px;background:var(--line);border-radius:11px}
.seg.mini button{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.seg.mini button.on{background:var(--card)}
.cat{font-size:13px;font-weight:600;color:var(--muted);margin:20px 0 2px}
.irow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.item{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:10px 0;min-height:52px;background:none;border-radius:0;text-align:left}
.cb{width:24px;height:24px;flex:none;border:2px solid var(--cb);border-radius:7px;display:grid;place-items:center}
.item .lab{flex:1;min-width:0;font-weight:500}
.item .by{display:block;font-size:13px;color:var(--muted);font-weight:400;text-decoration:none}
/* Les trois magasins */
.stores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stores button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:11px 12px;min-height:84px;border-radius:16px;border:1px solid var(--line);background:var(--card);text-align:left}
.stores b{font-size:15px;font-weight:600;line-height:1.2;margin-top:2px}
.stores span{font-size:13px;color:var(--muted)}
.stores button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stores button[aria-pressed="true"] span{color:inherit;opacity:.88}
.pbar{display:flex;align-items:center;gap:12px;padding:2px 4px 0}
.pbar .pn{font-size:15px;color:var(--muted);margin-bottom:7px}
.pbar .pn b{font-size:22px;color:var(--text);font-weight:600;letter-spacing:-.01em}
.pbar .prog{margin:0;height:5px}
/* Un rayon = une carte */
.rayon{background:var(--card);border-radius:20px;padding:6px 0 4px;box-shadow:var(--shadow);overflow:hidden}
.rh{display:flex;align-items:center;gap:12px;padding:8px 16px 4px}
.rh h2{flex:1;min-width:0;margin:0;font-size:16px;font-weight:600}
.rc{font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tile{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;color:color-mix(in srgb,var(--c) var(--tm),#fff);background:color-mix(in srgb,var(--c) 15%,var(--card))}
.t-fl{--c:#1f7a55}.t-vi{--c:#a4402a}.t-fr{--c:#2d5f9a}.t-ep{--c:#85590a}.t-su{--c:#1d6a80}.t-pa{--c:#8a5a1c}
.t-bo{--c:#7a4e9c}.t-en{--c:#a5541c}.t-hy{--c:#5b4b94}.t-ma{--c:#4e5650}.t-au{--c:#5f656b}
/* Un article : toucher = pris ; glisser vers la gauche = Modifier / Supprimer */
.art{position:relative;overflow:hidden}
.art .acts{position:absolute;top:0;right:0;bottom:0;display:flex;opacity:0;transition:opacity 0s .2s}
.art.open .acts,.art.drag .acts,.art .acts:focus-within{opacity:1;transition:none}
.art .acts button{width:84px;border-radius:0;min-height:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:600}
.a-ed{background:var(--line2)}
.a-del{background:var(--danger);color:var(--bg)}
.art .fg{position:relative;background:var(--card);transition:transform .2s;touch-action:pan-y}
.art.open .fg,.art .acts:focus-within+.fg{transform:translateX(-168px)}
.art.new .fg{background:var(--accent-soft)}
.tick{width:100%;display:flex;align-items:center;gap:14px;padding:10px 16px;min-height:58px;background:none;border-radius:0;text-align:left}
.ck{width:26px;height:26px;border-radius:13px;border:2px solid var(--cb);flex:none;display:grid;place-items:center}
.tick.got .ck{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.al{flex:1;min-width:0;font-weight:500;line-height:1.25}
.am{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick.got .an{color:var(--muted);text-decoration:line-through}
.aq{flex:none;font-size:14px;font-weight:500;background:var(--page);padding:4px 9px;border-radius:8px;font-variant-numeric:tabular-nums}
.tick.got .aq{background:none;color:var(--muted)}
.swhint{font-size:13px;color:var(--muted);text-align:center;margin:0}
/* Drive : panier Leclerc et état de la commande */
.leclerc{display:flex;flex-direction:column;gap:12px;width:100%;text-align:left;background:var(--accent);color:var(--on-accent);border-radius:20px;padding:16px}
.leclerc .lh{display:flex;align-items:center;gap:12px}
.leclerc .lt{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--on-accent) 16%,transparent);flex:none}
.leclerc b{display:block;font-size:17px;font-weight:600}
.leclerc .ls{font-size:14px;opacity:.9}
.lbar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--on-accent) 25%,transparent);overflow:hidden}
.lbar i{display:block;height:100%;background:var(--on-accent);border-radius:3px}
.lgo{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:14px;background:var(--on-accent);color:var(--accent);font-weight:600;font-size:15px}
.dnote{display:flex;gap:10px;align-items:flex-start;margin:-4px 4px 0;font-size:14px;line-height:1.4;color:var(--muted)}
.dnote .dot{width:8px;height:8px;border-radius:4px;background:var(--warn);flex:none;margin-top:6px}
.dnote b{color:var(--text);font-weight:600}
.dstat{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.dstat .dsi{width:36px;height:36px;border-radius:18px;background:var(--accent-soft);color:var(--accent-soft-text);display:grid;place-items:center;flex:none}
.dstat b{display:block;font-size:16px;font-weight:600}
.dstat .grow span{font-size:14px;color:var(--muted)}
/* La prochaine liste */
.next{background:var(--card);border:2px solid var(--accent);border-radius:20px;overflow:hidden;padding-bottom:4px}
.next-h{display:flex;align-items:flex-start;gap:12px;padding:14px 12px 10px 16px}
.next-h>svg.i{color:var(--accent);margin-top:2px}
.next-h h2{margin:0;font-size:18px;font-weight:600}
.next-h .nc{font-size:14px;font-weight:600;color:var(--accent-soft-text)}
.next-h p{margin:3px 0 0;font-size:14px;line-height:1.4;color:var(--muted)}
.next .nsub{font-size:13px;font-weight:600;color:var(--muted);margin:8px 16px 2px}
.nextlink{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:18px;border:1px dashed var(--outline);background:transparent;text-align:left}
.nextlink b{display:block;font-size:15px}
.nextlink .grow span{font-size:13px;color:var(--muted)}
.nextlink svg.i{color:var(--muted)}
.iconbtn.sm{width:36px;height:36px;min-height:36px}
/* Barre « Il manque quelque chose ? » et feuille d'ajout */
.addbar{position:fixed;left:0;right:0;bottom:calc(59px + max(env(safe-area-inset-bottom),8px));z-index:4;max-width:640px;margin:0 auto;padding:10px 16px;background:var(--page)}
.addpill{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:0 7px 0 18px;border-radius:27px;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 14px rgba(22,24,26,.08);color:var(--muted);font-size:16px;text-align:left}
.addpill .plus{width:40px;height:40px;border-radius:20px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.dupw{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--warn) 12%,var(--bg));border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.35;margin-top:8px}
.dupw svg.i{color:var(--warn);margin-top:1px}
/* Vue « Par repas » : une carte par repas */
.mcard{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);padding-bottom:4px}
.mcard-h{display:flex;align-items:center;gap:10px;padding:10px 12px 6px 16px}
.mhb{flex:1;min-width:0;background:none;padding:4px 0;border-radius:8px;text-align:left}
.mcard .ew{font-size:12px;font-weight:700;color:var(--accent-soft-text);text-transform:uppercase;letter-spacing:.05em}
.mcard .ew.off{color:var(--muted)}
.mcard .ew span{color:var(--muted)}

const $ = (s)=>document.querySelector(s);
const esc = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = (s)=>s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
function snack(msg, action, fn, ms=6000){
  const s=$('#snack');
  s.innerHTML=`<span>${esc(msg)}</span>${action?`<button type="button">${esc(action)}</button>`:''}`;
  if(action) s.querySelector('button').onclick=()=>{ hideSnack(); fn(); };
  s.classList.add('on'); clearTimeout(s._h); s._h=setTimeout(hideSnack, ms);
}
function hideSnack(){ $('#snack').classList.remove('on'); }
function toast(msg){ snack(msg, null, null, 2200); }
function fmtDate(iso){ const d=new Date(iso+'T00:00:00'); return d.getDate()+' '+MONTHS[d.getMonth()]; }
function toIso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return toIso(d); }
function todayIso(){ return toIso(new Date()); }
function dayIdx(iso){ return (new Date(iso+'T00:00:00').getDay()+6)%7; }
function longDate(iso){ const d=new Date(iso+'T00:00:00'); return DAYS[dayIdx(iso)]+' '+d.getDate()+' '+MONTHS_L[d.getMonth()]; }
function rangeLabel(w){
  const a=new Date(w.week_start+'T00:00:00'), b=new Date(addDays(w.week_start,6)+'T00:00:00');
  return a.getMonth()===b.getMonth() ? `${a.getDate()} – ${b.getDate()} ${MONTHS_L[b.getMonth()]}` : `${a.getDate()} ${MONTHS[a.getMonth()]} – ${b.getDate()} ${MONTHS[b.getMonth()]}`;
}
function guessCat(label){
  const l=label.toLowerCase();
  const map=[
    [/pomme|banane|poire|raisin|fraise|orange|clémentine|kiwi|melon|tomate|salade|carotte|courgette|poireau|oignon|ail|pomme de terre|patate|épinard|brocoli|haricot|concombre|avocat|citron|champignon|légume|fruit|poivron|aubergine|chou|radis|navet|endive|mangue|ananas|abricot|pêche|prune|cerise/, 'fruits_legumes'],
    [/poulet|bœuf|boeuf|steak|viande|porc|jambon|lardon|saucisse|saumon|poisson|cabillaud|thon|crevette|dinde|veau|agneau|merguez|chipolata|côte|escalope|haché/, 'viande_poisson'],
    [/lait|beurre|yaourt|fromage|crème|oeuf|œuf|emmental|comté|mozzarella|raclette|camembert|petit suisse|dessert/, 'frais'],
    [/pain|baguette|brioche|viennoiserie|croissant/, 'pain'],
    [/surgel|glace|frites|nugget|poisson pané|pizza surg/, 'surgele'],
    [/eau|jus|soda|coca|sirop|bière|vin|café|thé/, 'boissons'],
    [/shampo|savon|gel douche|dentifrice|brosse|coton|papier toilette|mouchoir|rasoir|déo|serviette|couche|lingette/, 'hygiene'],
    [/éponge|eponge|sac poubelle|lessive|liquide vaisselle|tablette|essuie|produit|javel|nettoyant|aluminium|film|sopalin/, 'maison'],
    [/compote|gourde|goûter|gouter|biscuit|céréale|cereale/, 'enfants'],
    [/pâte|pate|riz|semoule|farine|sucre|huile|sauce|conserve|boîte|boite|lentille|pois|quinoa|sel|poivre|épice|chocolat|confiture|miel|nutella|gâteau|chips|apéro|soupe|bouillon/, 'epicerie'],
  ];
  for (const [re,c] of map) if (re.test(l)) return c;
  return 'autre';
}

// ---------- Repas : moments, contraintes, étiquettes ----------
const DKEYS=['lun','mar','mer','jeu','ven','sam','dim'];
const slotOrder = (s)=>s==='midi'?0:1;
const mealSort = (a,b)=>a.day<b.day?-1:a.day>b.day?1:slotOrder(a.slot)-slotOrder(b.slot);
function isPast(m){ const t=todayIso(); if(m.day!==t) return m.day<t; const n=new Date(); return n.getHours()*60+n.getMinutes() >= SLOT_END[m.slot]; }
function weekOf(m){ return state.weeks.find(w=>w.id===m.week_id); }
function ctxOf(m){ return weekOf(m)?.context || {}; }
function findMeal(id){ return state.near.find(m=>m.id===id) || state.meals.find(m=>m.id===id); }
function dishFor(m){ const t=String(m.title||'').toLowerCase(); return state.dishes.find(d=>d.name.toLowerCase()===t); }
function kindLabel(m){ return m.kind==='recette' && dishFor(m)?.rating==='a_tester' ? 'Recette à tester' : (KIND[m.kind]||m.kind); }
function mealMeta(m){ return kindLabel(m) + (m.prep_minutes?` · ${m.prep_minutes} min`:''); }
function slotName(m){ return DAYS[dayIdx(m.day)].toLowerCase()+' '+m.slot; }
function whenLabel(m){
  const t=todayIso();
  if(m.day===t) return m.slot==='midi'?'ce midi':'ce soir';
  if(m.day===addDays(t,1)) return 'demain '+m.slot;
  if(m.day===addDays(t,-1)) return 'hier '+m.slot;
  const near = m.day>t && m.day<=addDays(t,6);
  return DAYS[dayIdx(m.day)].toLowerCase()+(near?'':' '+fmtDate(m.day))+' '+m.slot;
}
function shortTitle(t){ const s=String(t).split(/,| et | \+ | avec /)[0].trim(); return s.length>28 ? s.slice(0,27)+'…' : s; }
// Contraintes d'un créneau : sport des enfants, planning d'Audrey (« matin », « soir », « repos »).
function constraints(day, slot, ctx){
  const k=DKEYS[dayIdx(day)], out=[];
  if(SPORT[k]===slot) out.push({kind:'sport', label: slot==='midi'?'Sport le midi':'Sport'});
  if(slot==='soir'){
    const a=(ctx.planning||{})[k] || ctx.jours?.[k]?.audrey;
    if(a==='soir') out.push({kind:'seul', label:FOYER.papa+' seul'});
    else if(a==='matin'||a==='repos') out.push({kind:'la', label:FOYER.maman+' est là'});
  }
  return out;
}
function dayTags(day, ctx){
  return [...constraints(day,'midi',ctx), ...constraints(day,'soir',ctx), ...(ctx.events||[]).filter(e=>e.day===day).map(e=>({kind:'event',label:e.label}))];
}
function tagHtml(c, sm){
  const s=sm?' sm':'';
  if(c.kind==='sport') return `<span class="tag ink${s}">${ic('sport','s')}${esc(c.label)}</span>`;
  if(c.kind==='seul') return `<span class="tag line${s}">${esc(c.label)}</span>`;
  if(c.kind==='la') return `<span class="tag ok${s}">${esc(c.label)}</span>`;
  if(c.kind==='event') return `<span class="tag ev${s}">${ic('star','s')}${esc(c.label)}</span>`;
  return '';
}
// Repas proches (2 jours en arrière, 9 en avant), uniquement des semaines validées.
function nearMeals(){ const ids=new Set(state.weeks.map(w=>w.id)); return state.near.filter(m=>ids.has(m.week_id)).sort(mealSort); }
function isRated(m){ return state.feedback.some(f=>f.content?.meal_id===m.id); }
function canRate(m){ return RATEABLE.includes(m.kind) && m.day>=addDays(todayIso(),-2) && !isRated(m); }

// ---------- Rendu ----------
function render(){
  const app=$('#app');
  // garde la saisie en cours si une mise à jour arrive pendant qu'on tape
  const ae=document.activeElement;
  const keep=(ae && ae.id && /^(INPUT|TEXTAREA)$/.test(ae.tagName)) ? {id:ae.id, v:ae.value, s:ae.selectionStart, e:ae.selectionEnd} : null;
  let nav=false;
  if(!state.session){ app.innerHTML=renderLogin(); bindLogin(); }
  else if(state.member===false){ app.innerHTML=renderNotMember(); bindNotMember(); }
  else if(state.member===null){ app.innerHTML='<div class="empty">Chargement…</div>'; }
  else if(state.rev){ app.innerHTML=renderReview(); bindReview(); }
  else if(state.wiz){ app.innerHTML=renderWizard(); bindWizard(); }
  else if(state.drive){ app.innerHTML=renderDrive(); bindDrive(); }
  else {
    const t=state.tab;
    const body = t==='semaine'?renderSemaine(): t==='courses'?renderCourses(): t==='reglages'?renderReglages(): renderHome();
    nav = t!=='reglages';
    app.innerHTML = body + (nav ? `<nav class="tabs" aria-label="Navigation principale">
      ${tabBtn('accueil','cloche','Prochain repas')}${tabBtn('semaine','cal','Semaine')}${tabBtn('courses','bag','Courses', coursesLeft())}
    </nav>` : '');
    bindMain();
  }
  document.body.classList.toggle('nonav', !nav);
  const courses = nav && state.tab==='courses';   // fond gris, cartes blanches, barre d'ajout
  document.documentElement.classList.toggle('grey', courses); document.body.classList.toggle('withadd', courses);
  if(keep){ const el=document.getElementById(keep.id); if(el && el!==document.activeElement){ el.value=keep.v; el.focus(); try{ el.setSelectionRange(keep.s,keep.e); }catch{} } }
}

}

function nextMondayAfterToday(){ return addDays(todayIso(), 7-dayIdx(todayIso())); }

function prepBanner(force){

// Accueil : le prochain repas
function renderHome(){
  const all=nearMeals(), fut=all.filter(m=>!isPast(m)), next=fut[0], after=fut[1];
  const toRate=all.filter(m=>isPast(m) && canRate(m)).pop();
  let h=`<header class="top"><span class="date">${esc(longDate(todayIso()))}</span>${avatarBtn()}</header><main>`;
  if(!next){
    h+=`<div class="empty"><b>Rien de prévu pour l'instant.</b><br>${state.draft?'La semaine est préparée : le menu arrive dès que Claude l\'a fait.':`Préparez la semaine ici, puis ${esc(FOYER.papa)} lance Claude sur le Mac.`}</div>`;
    h+=prepBanner(true);
  } else {
    const ctx=ctxOf(next), cons=constraints(next.day,next.slot,ctx), evs=(ctx.events||[]).filter(e=>e.day===next.day);
    const cooking=cookSaved(next.id);
    h+=`<section class="hero" aria-labelledby="nexttitle">
      <div class="eyebrow">${ic('cloche','s')}<span>Prochain repas · ${esc(whenLabel(next))}</span></div>
      <h2 id="nexttitle">${esc(next.title)}</h2>
      <div class="tags">${next.prep_minutes?`<span class="tag">${ic('clock','s')}${next.prep_minutes} min</span>`:''}<span class="tag">${esc(kindLabel(next))}</span>${cons.map(c=>tagHtml(c)).join('')}${evs.map(e=>tagHtml({kind:'event',label:e.label})).join('')}</div>
      ${next.notes?`<p class="note">${esc(next.notes)}</p>`:''}
      <div class="actions">
        ${NO_COOK.includes(next.kind)?'':`<button class="primary btn big" data-cook="${next.id}">${ic('pot')}${cooking?'Mode cuisine · minuteur en cours':'Mode cuisine'}</button>`}
        <div class="two ${next.url?'':'one'}">
          ${next.url?`<a class="btn outline" href="${esc(next.url)}" target="_blank" rel="noopener">Recette ${ic('ext','s')}</a>`:''}
          <button class="btn outline" data-swap="${next.id}">${ic('swap','s')}Échanger</button>
        </div>
      </div>
    </section>`;
    if(after){
      const c2=constraints(after.day,after.slot,ctxOf(after));
      h+=`<section class="sect"><div class="sect-h"><h3>Ensuite · ${esc(whenLabel(after))}</h3><button class="link" data-tab="semaine">Toute la semaine</button></div>
        <div class="next-t">${esc(after.title)}</div>
        <div class="tags">${c2.map(c=>tagHtml(c,true)).join('')}<span class="meta">${esc(mealMeta(after))}</span></div></section>`;
    }
  }
  if(toRate){
    h+=`<section class="box" aria-labelledby="ratet"><h3 id="ratet">${esc(cap(whenLabel(toRate)))}, c'était comment ?</h3><div class="sub">${esc(toRate.title)}</div>
      <div class="trio">
        <button data-rate="refait" data-id="${toRate.id}">On refait</button>
        <button data-rate="bof" data-id="${toRate.id}">Bof</button>
        <button data-rate="jamais" data-id="${toRate.id}">Plus jamais</button>
      </div></section>`;
  }
  if(next) h+=prepBanner(false);
  return h+'</main>';
}

// Semaine
function renderSemaine(){
  const w=curWeek();
  let h=`<header class="top"><h1>Semaine</h1>${w?weekNav():''}</header>`;

function liveWeek(){ const t=todayIso(); return state.weeks.find(w=>w.week_start<=t && addDays(w.week_start,6)>=t) || null; }
function upcomingWeeks(){ const t=todayIso(); return state.weeks.filter(w=>addDays(w.week_start,6)>=t).sort((a,b)=>a.week_start.localeCompare(b.week_start)); }
function targetWeek(ch){
  if(ch!=='drive') return liveWeek() || upcomingWeeks()[0] || null;   // Grand Frais, boucher : la semaine en cours

// Recherche : tous magasins, articles pris compris ; sur le nom, la quantité et les repas liés, sans tenir compte des accents
const fold=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function renderFound(all){
  const words=fold(state.q).split(/\s+/).filter(Boolean);
  const hay=it=>fold([it.label, it.qty, ...itemMeals(it).map(l=>l.meal.title)].join(' '));
  const xs=all.filter(it=>{ const t=hay(it); return words.every(w=>t.includes(w)); });
  if(!xs.length) return `<div class="empty">Rien qui corresponde à « ${esc(state.q.trim())} » dans cette liste.<br><span class="noted">Pour l'ajouter, touchez « Il manque quelque chose ? » en bas.</span></div>`;
  const done=xs.filter(i=>i.status==='achete').length;
  return `<p class="sub" aria-live="polite" style="margin:0 4px">${xs.length===1?'1 article trouvé':xs.length+' articles trouvés'}${done&&done<xs.length?` · ${done} déjà pris`:''}</p>`+renderRayons(xs,{all:true});
}
function markQ(label){
  const words=fold(state.q).split(/\s+/).filter(Boolean); if(!words.length) return esc(label);
  // repère les passages trouvés sur le texte replié (même longueur que l'original pour le français courant)
  const f=fold(label); if(f.length!==label.length) return esc(label);
  const on=new Array(label.length).fill(false);
  for(const w of words){ let i=f.indexOf(w); while(i>=0){ for(let k=i;k<i+w.length;k++) on[k]=true; i=f.indexOf(w,i+1); } }
  let out='', open=false;
  for(let k=0;k<label.length;k++){ if(on[k]!==open){ out+=on[k]?'<mark>':'</mark>'; open=on[k]; } out+=esc(label[k]); }
  return out+(open?'</mark>':'');
}
// un article déjà prévu (a_acheter) là où irait cet ajout
function pendingFor(label){

  return [...state.items, ...state.backlog].find(i=>{ const f=fold(i.label); return i.status==='a_acheter' && (f.includes(l) || l.includes(f)); }) || null;

// La prochaine liste : en tête une fois la commande drive passée, sinon un lien en bas de la liste
function renderNext(prominent){

  let h=`<section class="next" aria-labelledby="nextt"><div class="next-h">${ic('note')}<div class="grow"><div class="row"><h2 id="nextt" class="grow">Prochaine liste</h2><span class="nc">${n===0?'vide':n===1?'1 article':n+' articles'}</span>${prominent?'':`<button class="iconbtn round sm" id="nexttoggle" aria-expanded="true" aria-label="Replier la prochaine liste">${ic('up','s')}</button>`}</div>

function swipeRow(it, inner){

// Glisser un article vers la gauche : Modifier / Supprimer. Toucher ailleurs referme.
function bindSwipes(){
  const W=168;
  document.querySelectorAll('.art').forEach(row=>{
    const fg=row.querySelector('.fg'); let x0=0, y0=0, dx=0, base=0, drag=false, pid=null;
    fg.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse' && e.button!==0) return; pid=e.pointerId; x0=e.clientX; y0=e.clientY; dx=0; drag=false; base=row.classList.contains('open')?-W:0; });
    fg.addEventListener('pointermove',e=>{
      if(e.pointerId!==pid) return;
      const mx=e.clientX-x0, my=e.clientY-y0;
      if(!drag){
        if(Math.abs(mx)>10 && Math.abs(mx)>Math.abs(my)*1.3){ drag=true; try{ fg.setPointerCapture(pid); }catch{} fg.style.transition='none'; row.classList.add('drag'); document.querySelectorAll('.art.open').forEach(r=>{ if(r!==row) r.classList.remove('open'); }); }
        else { if(Math.abs(my)>10) pid=null; return; }
      }
      dx=Math.max(-W-24, Math.min(0, base+mx)); fg.style.transform=`translateX(${dx}px)`;
    });
    const end=e=>{
      if(e.pointerId!==pid) return; pid=null; if(!drag) return;
      fg.style.transition=''; fg.style.transform='';
      const o=dx<-W/2; row.classList.remove('drag'); row.classList.toggle('open',o); row._dragged=true; setTimeout(()=>{ row._dragged=false; },60);
      if(o) localStorage_set('swiped','1');
    };
    fg.addEventListener('pointerup',end); fg.addEventListener('pointercancel',end);
    // après un glissé, ou sur une ligne ouverte, le toucher referme au lieu de cocher
    fg.addEventListener('click',e=>{ if(row._dragged || row.classList.contains('open')){ e.stopPropagation(); e.preventDefault(); if(!row._dragged) row.classList.remove('open'); } }, true);
  });
}

    hh.querySelectorAll('[data-hh]').forEach(b=>b.onclick=async()=>{

// ---------- Mode Drive ----------
// Solution de secours au pilotage de Chrome par Claude (bloqué par Leclerc le 2026-10-10) : Claude prépare la liste
// (drive_product = produit conseillé, drive_query = mots à chercher), le foyer remplit le panier lui-même.
// Chaque article : « Chercher » ouvre la recherche sur le drive, puis « Dans le panier » ou « Pas trouvé » (drive_cart).
// « Commande validée » pose weeks.drive_ordered_at ; ce qui n'est pas au panier part sur la prochaine liste.
function driveBase(){ const m=String(state.settings.leclerc_drive_url||'').match(/^https:\/\/[^\/?#]*leclercdrive\.fr\/magasin-[^\/?#]+/i); return m?m[0]:null; }
function driveStore(){ const b=driveBase(); if(!b) return ''; const m=b.match(/magasin-\d+-(.+)$/i); return m?decodeURIComponent(m[1]).replace(/-/g,' '):b.replace(/^https:\/\//,''); }
function driveSearch(it){ const q=(it.drive_query||it.drive_product||it.label).trim(); return driveBase()+'/recherche.aspx?TexteRecherche='+encodeURIComponent(q).replace(/%20/g,'+'); }
function driveList(){ return state.items.filter(i=>i.channel==='drive' && i.status==='a_acheter'); }
function catRank(it){ const i=CAT_ORDER.indexOf(it.category||'autre'); return i<0?99:i; }
function renderDrive(){
  const w=curWeek(), all=driveList().sort((a,b)=>catRank(a)-catRank(b)||a.label.localeCompare(b.label));
  const todo=all.filter(i=>!i.drive_cart), done=all.filter(i=>i.drive_cart);
  let h=`<header class="top"><div class="row"><button class="iconbtn" id="drback" aria-label="Retour aux courses">${ic('left','s')}</button><h1>Panier Leclerc</h1></div></header>`;

  h+='<main>';
  if(!driveBase()) return h+`<section class="dsetup"><h2>D'abord, l'adresse de votre drive</h2>
    <ol><li>Ouvrez votre drive Leclerc dans le navigateur, connecté à votre compte.</li><li>Copiez l'adresse de la page (elle contient « leclercdrive.fr/magasin-… »).</li><li>Collez-la ici : c'est à faire une seule fois.</li></ol>
    <div class="row"><input id="drurl" class="grow" type="url" inputmode="url" placeholder="https://fd…-courses.leclercdrive.fr/magasin-…" autocomplete="off"><button class="addbtn" id="drsave" aria-label="Enregistrer l'adresse du drive">${ic('check')}</button></div></section></main>`;
  if(w && driveOrdered(w)) return h+`<div class="empty"><b>Commande drive passée</b><br>Ce que vous ajoutez au Drive va maintenant sur la prochaine liste.</div></main>`;
  if(!all.length) return h+`<div class="empty">Rien à mettre au panier Drive cette semaine.</div></main>`;
  h+=`<div class="sub"><b style="color:var(--text)">${done.length}</b> sur ${all.length} articles faits</div><div class="prog"><i style="width:${Math.round(done.length/all.length*100)}%"></i></div>`;
  h+=`<p class="noted">« Chercher » ouvre la recherche sur votre drive. Ajoutez le produit au panier, revenez ici et touchez « Dans le panier ».</p>`;
  let cat=null;
  for(const it of todo){
    if(it.category!==cat){ cat=it.category; h+=`<h2 class="cat">${esc(CATS[cat||'autre']||'Autre')}</h2>`; }
    const uses=itemMeals(it);
    h+=`<section class="dcard" aria-label="${esc(it.label)}"><div class="dh"><span class="dl">${esc(it.label)}</span>${it.qty?`<span class="dq">${esc(it.qty)}</span>`:''}</div>
      ${it.drive_product?`<div class="dp">Conseillé : <b>${esc(it.drive_product)}</b></div>`:''}
      ${uses.length?`<div class="dp">Pour ${esc(uses.map(l=>whenShort(l.meal).toLowerCase()+' ('+shortTitle(l.meal.title)+')').join(', '))}</div>`:''}
      <div class="da"><a class="btn outline" href="${esc(driveSearch(it))}" target="_blank" rel="noopener">Chercher${ic('ext','s')}</a>
      <button class="btn primary" data-dcart="${it.id}" data-v="mis">${ic('check','s')}Dans le panier</button>
      <button class="dmiss" data-dcart="${it.id}" data-v="introuvable">Pas trouvé sur le drive</button></div></section>`;
  }
  if(!todo.length) h+=`<div class="empty" style="padding-top:28px"><b>Tout est traité !</b><br>Vérifiez le panier sur Leclerc, choisissez le créneau et validez la commande là-bas.</div>`;
  if(done.length){
    h+=`<button class="donebar" id="drshowdone" aria-expanded="${state.driveDone}"><span class="cb">${ic('check','xs')}</span><span class="grow">${done.length===1?'1 article fait':done.length+' articles faits'}</span>${ic(state.driveDone?'up':'down','s')}</button>`;

  }
  h+=`<div class="dfoot"><button class="btn big ${todo.length?'outline':'primary'}" id="drorder" style="width:100%">J'ai validé la commande sur Leclerc</button></div>`;
  return h+'</main>';

// Échanger un repas avec n'importe quel autre repas de la même semaine
function swapWarnings(a, b){
  // a va sur le créneau de b, et b sur celui de a
  const ctx=ctxOf(a), out=[];
  for(const [m, day, slot] of [[a,b.day,b.slot],[b,a.day,a.slot]]){
    if(NO_COOK.includes(m.kind) || m.kind==='restes') continue;
    const cons=constraints(day,slot,ctx), mins=m.prep_minutes||0, name=shortTitle(m.title), k=DKEYS[dayIdx(day)];
    if(cons.some(c=>c.kind==='sport') && mins>10) out.push(`${name} (${mins} min) ${slot==='midi'?'un midi':'un soir'} de sport`);
    else if(cons.some(c=>c.kind==='seul') && mins>15) out.push(`${name} (${mins} min), ${FOYER.papa} seul`);
    if(cons.some(c=>c.kind==='seul') && dishFor(m)?.rating==='a_tester') out.push(`${name} : plat à tester, ${FOYER.papa} seul`);
    if(mins>20 && !(ctx.cuisine_longue||[]).includes(k)) out.push(`${name} (${mins} min) un jour sans cuisine longue`);
  }
  return out;
}

      ${pool.length?`<div role="radiogroup" aria-labelledby="swt">${pool.map(o=>{

          <span class="ot">${esc(o.title)}</span>

          ${warns.map(x=>`<span class="warn">${ic('alert','xs')}<span>${esc(x)}</span></span>`).join('')}
        </button>`; }).join('')}</div>`:`<p class="sub">Pas d'autre repas à venir cette semaine.</p>`}
      <div class="foot"><p class="sub center" style="margin:0">La liste de courses ne change pas : les ingrédients suivent leur plat.</p>
        <button class="primary btn big" id="swapgo" ${tgt?'':'disabled'}>${ic('swap','s')}${tgt?`Échanger ${esc(slotName(src))} et ${esc(slotName(tgt))}`:'Choisissez un repas'}</button></div>`;
    s.scrollTop=y;
    s.querySelector('[data-close]').onclick=closeSheet;
    s.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{ sel=b.dataset.o; draw(); });
    const go=s.querySelector('#swapgo'); if(go && tgt) go.onclick=()=>doSwap(src,tgt);
  };
  draw();
}
async function doSwap(a0, b0){
  const A={...a0}, B={...b0};
  const content=m=>({title:m.title, kind:m.kind, url:m.url??null, prep_minutes:m.prep_minutes??null, notes:m.notes??null});
  const slot=m=>({id:m.id, week_id:m.week_id, day:m.day, slot:m.slot});
  // Une seule requête : chaque créneau garde sa place, seul le contenu change (pas de conflit jour/créneau).
  const rows=[{...slot(A),...content(B)}, {...slot(B),...content(A)}];
  closeSheet();
  const {error}=await sb.from('meals').upsert(rows,{onConflict:'id'});
  if(error){ toast('Échange impossible : '+error.message); return; }
  await swapLinks(A, B);
  applyLocal(rows); state.swapMarks[A.id]=slotName(B); state.swapMarks[B.id]=slotName(A); render();
  snack(`${cap(slotName(A))} et ${slotName(B)} échangés`, 'Annuler', async()=>{
    const back=[{...slot(A),...content(A)}, {...slot(B),...content(B)}];
    const {error}=await sb.from('meals').upsert(back,{onConflict:'id'});
    if(error){ toast('Erreur : '+error.message); return; }
    await swapLinks(A, B);
    applyLocal(back); delete state.swapMarks[A.id]; delete state.swapMarks[B.id]; render(); toast('Échange annulé');
  });
}
// Après un échange, le contenu des deux créneaux a permuté : les articles reliés suivent leur plat (for_meals).
async function swapLinks(A, B){
  const {data,error}=await sb.from('shopping_items').select('id,for_meals').eq('week_id',A.week_id);
  if(error){ toast('Liens des courses non mis à jour : '+error.message); return; }
  const flip=id=>id===A.id?B.id:id===B.id?A.id:id;
  for(const r of (data||[])){
    const fm=r.for_meals||[]; if(!fm.some(l=>l.meal_id===A.id||l.meal_id===B.id)) continue;
    const next=fm.map(l=>({...l, meal_id:flip(l.meal_id)}));
    const {error:e2}=await sb.from('shopping_items').update({for_meals:next}).eq('id',r.id);
    if(e2){ toast('Erreur : '+e2.message); return; }
    const loc=state.items.find(i=>i.id===r.id); if(loc) loc.for_meals=next;
  }
}
function applyLocal(rows){ for(const r of rows) for(const list of [state.meals,state.near]){ const m=list.find(x=>x.id===r.id); if(m) Object.assign(m,r); } }

// Noter un repas : met à jour la note du plat (dishes.rating) et garde une trace pour Claude.
async function rateMeal(id, avis){
  const m=findMeal(id); if(!m) return;
  const d=dishFor(m);
  const rating = avis==='refait'?'valide' : avis==='jamais'?'banni' : (d?.rating||'a_tester');
  state.feedback.push({content:{type:'avis_repas', meal_id:m.id}}); render();
  const jobs=[sb.from('feedback_log').insert({week_id:m.week_id, kind:'autre', content:{type:'avis_repas', meal_id:m.id, day:m.day, slot:m.slot, title:m.title, avis, par:state.session.user.email}})];
  if(d){ if(d.rating!==rating) jobs.push(sb.from('dishes').update({rating}).eq('id',d.id)); }
  else jobs.push(sb.from('dishes').upsert({name:m.title, kind:RATEABLE.includes(m.kind)?m.kind:'assemblage', url:m.url||null, prep_minutes:m.prep_minutes||null, rating},{onConflict:'name'}));
  const res=await Promise.all(jobs); const err=res.find(r=>r.error)?.error;
  if(err){ toast('Erreur : '+err.message); await loadWeekData(); return; }
  if(d) d.rating=rating; else state.dishes.push({name:m.title, rating});
  toast(avis==='refait'?'Noté : on le refera':avis==='jamais'?'Noté : Claude ne le proposera plus':'Noté, merci');
}

// ---------- Mode cuisine : minuteur + écran allumé ----------
const cook={meal:null,total:0,endAt:0,left:0,running:false,done:false,lock:null,tick:null,ac:null};
function cookSaved(id){ try{ const s=JSON.parse(localStorage_get('cook')||'null'); return s && s.id===id && s.running && s.endAt>Date.now(); }catch{ return false; } }
function saveCook(){ localStorage_set('cook', JSON.stringify({id:cook.meal.id,total:cook.total,running:cook.running,endAt:cook.endAt,left:cook.left})); }
function cookLeft(){ return cook.running ? Math.max(0, Math.ceil((cook.endAt-Date.now())/1000)) : cook.left; }
function openCook(id){
  const m=findMeal(id); if(!m) return;
  let s=null; try{ s=JSON.parse(localStorage_get('cook')||'null'); }catch{}
  cook.meal=m; cook.done=false;
  if(s && s.id===m.id){ Object.assign(cook,{total:s.total,running:s.running,endAt:s.endAt,left:s.left}); }
  else { cook.total=(m.prep_minutes||15)*60; cook.left=cook.total; cook.running=false; cook.endAt=0; }
  const d=dishFor(m), cons=constraints(m.day,m.slot,ctxOf(m));
  const el=$('#cook');
  el.innerHTML=`<div class="cook-in">
    <div class="cook-top"><button class="iconbtn round" id="cclose" aria-label="Quitter le mode cuisine">${ic('x','s')}</button>
      <span class="pill" id="lockpill">${ic('sun','s')}<span id="locktxt">Écran…</span></span></div>
    <div><div class="eyebrow">${ic('cloche','s')}<span>${esc(cap(whenLabel(m)))}</span></div><h2>${esc(m.title)}</h2></div>
    <section class="timer" aria-label="Minuteur">
      <div class="trow"><span>Minuteur</span><span id="ttot"></span></div>
      <div class="tm" id="tm" role="timer"></div>
      <div class="tbar"><i id="tbar"></i></div>
      <div class="tctl"><button class="primary btn big" id="tgo"></button><button class="outline" id="tplus">+1 min</button><button class="outline iconbtn" id="treset" style="width:52px;height:52px;border-radius:14px" aria-label="Remettre le minuteur à zéro">${ic('reset','s')}</button></div>
    </section>
    <section>
      ${d?.rating==='a_tester'?`<div class="kv"><span>Plan B</span><span><b>Des pâtes</b><span class="sub">Plat encore à tester avec ${esc(FOYER.enfants.join(' et '))}.</span></span></div>`:''}
      ${m.notes?`<div class="kv"><span>Notes</span><span>${esc(m.notes)}</span></div>`:''}
      ${cons.length?`<div class="kv"><span>${m.slot==='midi'?'Ce midi':'Ce soir'}</span><span>${esc(cons.map(c=>c.label).join(' · '))}</span></div>`:''}
    </section>
    ${m.url?`<a class="btn big outline" href="${esc(m.url)}" target="_blank" rel="noopener">Ouvrir la recette ${ic('ext','s')}</a>`:''}
  </div>`;
  el.classList.add('on'); document.body.style.overflow='hidden';
  $('#cclose').onclick=closeCook;
  $('#tgo').onclick=()=>{ unlockAudio();
    if(cook.done){ cook.left=cook.total; cook.done=false; }
    if(cook.running){ cook.left=cookLeft(); cook.running=false; }
    else { cook.endAt=Date.now()+cook.left*1000; cook.running=true; }
    saveCook(); updateCook(true);
  };
  $('#tplus').onclick=()=>{ unlockAudio();
    if(cook.done){ cook.done=false; cook.left=60; cook.total=60; cook.endAt=Date.now()+60000; cook.running=true; }
    else if(cook.running){ cook.endAt+=60000; cook.total+=60; }
    else { cook.left+=60; cook.total+=60; }
    saveCook(); updateCook(true);
  };
  $('#treset').onclick=()=>{ cook.running=false; cook.done=false; cook.total=(m.prep_minutes||15)*60; cook.left=cook.total; saveCook(); updateCook(true); };
  updateCook(true); clearInterval(cook.tick); cook.tick=setInterval(updateCook, 250);
  acquireLock();
}
function closeCook(){
  clearInterval(cook.tick); cook.tick=null;
  if(cook.lock){ cook.lock.release().catch(()=>{}); cook.lock=null; }
  if(cook.meal) saveCook();
  $('#cook').classList.remove('on'); document.body.style.overflow=''; render();
}
function fmtClock(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function updateCook(force){
  const left=cookLeft();
  if(cook.running && left===0 && !cook.done){ cook.done=true; cook.running=false; cook.left=0; saveCook(); alarm(); force=true; }
  const tm=$('#tm'); if(!tm) return;
  tm.textContent = cook.done ? 'C\'est prêt !' : fmtClock(left);
  tm.classList.toggle('fin', cook.done);
  $('#tbar').style.width = Math.min(100, Math.round((1-left/Math.max(1,cook.total))*100))+'%';
  if(force){
    $('#ttot').textContent=`sur ${Math.round(cook.total/60)} min`;
    $('#tgo').innerHTML = cook.done ? `${ic('reset','s')}Relancer` : cook.running ? `${ic('pause','s')}Pause` : left<cook.total ? `${ic('play','s')}Reprendre` : `${ic('play','s')}Démarrer`;
  }
}
async function acquireLock(){
  const p=$('#lockpill'), t=$('#locktxt'); if(!p) return;
  const off=()=>{ p.classList.remove('on'); t.textContent='Écran : réglage du téléphone'; };
  if(!('wakeLock' in navigator)) return off();
  try{ cook.lock=await navigator.wakeLock.request('screen'); p.classList.add('on'); t.textContent='Écran allumé'; cook.lock.addEventListener('release',()=>{ cook.lock=null; }); }
  catch{ off(); }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && $('#cook').classList.contains('on') && !cook.lock) acquireLock(); });
function unlockAudio(){ try{ cook.ac ||= new (window.AudioContext||window.webkitAudioContext)(); if(cook.ac.state==='suspended') cook.ac.resume(); }catch{} }
function alarm(){
  try{ navigator.vibrate?.([400,200,400,200,400]); }catch{}
  const ac=cook.ac; if(!ac) return;
  const t0=ac.currentTime;
  for(let i=0;i<4;i++){ const o=ac.createOscillator(), g=ac.createGain(), s=t0+i*0.45;
    o.frequency.value=880; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(0.4,s+0.02); g.gain.exponentialRampToValueAtTime(0.0001,s+0.32);
    o.start(s); o.stop(s+0.35); }
}

// ---------- Assistant « Préparer la semaine » ----------
const DK=['lun','mar','mer','jeu','ven','sam','dim'];
const DAYN={lun:'Lundi',mar:'Mardi',mer:'Mercredi',jeu:'Jeudi',ven:'Vendredi',sam:'Samedi',dim:'Dimanche'};
function nextMonday(){ const d=new Date(); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()+(dow<=1?-dow:7-dow)); return toIso(d); }
const QUI=[['kevin',FOYER.papa],['audrey',FOYER.maman],['cassandre',FOYER.enfants[0]||'Enfant 1'],['achille',FOYER.enfants[1]||'Enfant 2']];
const QUI_NOM=Object.fromEntries(QUI);
// Qui mange par défaut : Kevin jamais le midi en semaine, toujours le soir, midi et soir le week-end.
// Audrey du matin → soir seulement ; du soir → midi seulement ; repos → les deux.
// Enfants : cantine lun/mar/jeu/ven ; mercredi midi à la maison seulement si Audrey est de repos ; sam/dim midi à la maison ; toujours le soir.
function defautsQui(k, audrey){
  const we=(k==='sam'||k==='dim');
  const midi=we?['kevin']:[], soir=['kevin'];
  if(audrey==='matin') soir.push('audrey'); else if(audrey==='soir') midi.push('audrey'); else if(audrey==='repos'){ midi.push('audrey'); soir.push('audrey'); } else soir.push('audrey');
  if(we || (k==='mer' && audrey==='repos')) midi.push('cassandre','achille');
  soir.push('cassandre','achille');
  return {midi, soir};
}
function nomsQui(list){ if(!list||!list.length) return 'personne'; if(list.length===4) return 'tout le monde'; return list.map(x=>QUI_NOM[x]||x).join(', '); }
function emptyContext(){
  const jours={}; for(const k of DK) jours[k]={audrey:'', ...defautsQui(k,''), custom:false};
  return {jours, events:[], cuisine_longue:[], commande:{souhaite:false,jour:'',quoi:''}, envies:'', restes:'', fruits_legumes:'magasin', besoins_maison:'', placard_manque:[], invites:''};
}
function openWizard(draft){
  const ctx=Object.assign(emptyContext(), draft?.context||{});
  if(!ctx.jours||Object.keys(ctx.jours).length<7) ctx.jours=emptyContext().jours;
  for(const k of DK){ const j=ctx.jours[k]; if(!Array.isArray(j.midi)){ Object.assign(j, defautsQui(k, j.audrey), {custom:false}); } }
  state.wiz={step:0, week_start: draft?.week_start || nextMonday(), id: draft?.id||null, ctx};
  render(); window.scrollTo(0,0);
}
const WIZ_STEPS=['Semaine','Audrey','Repas à prévoir','Événements','Envies','Courses','Placard','Récap'];
// Tour du placard : fonds de placard (household_items.placard = groupe), on coche ce qui manque → context.placard_manque.
const PLACARD_GROUPES=['Pâtes, riz et féculents','Frigo d\'avance','Conserves','Assaisonnement','Bouillons et sauces','Huiles et vinaigres','Épicerie de base'];
const plHint=n=>(n?`<b>${n}</b> à racheter.`:'Rien ne manque ? Touchez Suivant.')+' Autre chose ? Ajoutez-le à l\'écran précédent, dans les besoins pour la maison.';
function seg(name,val,opts){ return `<div class="seg" data-seg="${name}">${opts.map(([v,l])=>`<button data-v="${v}" class="${val===v?'on':''}" aria-pressed="${val===v}">${l}</button>`).join('')}</div>`; }
function renderWizard(){
  const z=state.wiz, c=z.ctx, n=WIZ_STEPS.length, s=z.step;
  let body='';
  if(s===0){
    body=`<h2>On prépare quelle semaine ?</h2><p class="lead">Par défaut, la semaine qui vient.</p>

  } else if(s===1){
    body=`<h2>Le planning ${/^[aeiouyhéè]/i.test(FOYER.maman)?'d\'':'de '}${esc(FOYER.maman)}</h2><p class="lead">Du matin, du soir, ou en repos ?</p><div class="card" style="padding:4px 14px">`+
      DK.map(k=>`<div class="dayrow"><div class="dn">${DAYN[k].slice(0,3)}.</div>${seg('audrey:'+k, c.jours[k].audrey, [['matin','Matin'],['soir','Soir'],['repos','Repos']])}</div>`).join('')+`</div>`;
  } else if(s===2){
    for(const k of DK){ if(!c.jours[k].custom) Object.assign(c.jours[k], defautsQui(k, c.jours[k].audrey)); }

    <div class="wiz-head"><button class="iconbtn round" id="wclose" aria-label="Fermer">${ic('x','s')}</button><span class="step">Étape ${s+1} sur ${n} · ${WIZ_STEPS[s]}</span></div>

}
function curWeekCtx(id){ const w=state.weeks.find(x=>x.id===id); return w?.context||{}; }
function collectWizard(){

function bindWizard(){

  document.querySelectorAll('[data-seg]').forEach(sg=>sg.onclick=e=>{
    const b=e.target.closest('button'); if(!b) return; const [name,k]=sg.dataset.seg.split(':'); const v=b.dataset.v;

  document.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{ const l=b.dataset.pl, i=c.placard_manque.indexOf(l); if(i>=0) c.placard_manque.splice(i,1); else c.placard_manque.push(l); b.classList.toggle('on',i<0); b.setAttribute('aria-pressed',i<0); $('#plhint').innerHTML=plHint(c.placard_manque.length); });
  document.querySelectorAll('[data-qui]').forEach(b=>b.onclick=()=>{ const [k,slot,id]=b.dataset.qui.split(':'); const arr=c.jours[k][slot]; const i=arr.indexOf(id); if(i>=0) arr.splice(i,1); else arr.push(id); c.jours[k].custom=true; b.classList.toggle('on'); b.setAttribute('aria-pressed',b.classList.contains('on')); });
  const lg=$('#long'); if(lg) lg.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; const k=b.dataset.k; c.cuisine_longue=c.cuisine_longue.includes(k)?c.cuisine_longue.filter(x=>x!==k):[...c.cuisine_longue,k]; b.classList.toggle('on'); b.setAttribute('aria-pressed',b.classList.contains('on')); };
  const ea=$('#evadd'); if(ea) ea.onclick=()=>{ collectWizard(); c.events.push({day:z.week_start,label:''}); render(); setTimeout(()=>{ const l=document.querySelectorAll('[data-evl]'); l[l.length-1]?.focus(); },50); };
  document.querySelectorAll('[data-evx]').forEach(b=>b.onclick=()=>{ collectWizard(); c.events.splice(+b.dataset.evx,1); render(); });
  const ws=$('#ws'); if(ws) ws.onchange=()=>{ collectWizard(); render(); };
  const sv=$('#wsave'); if(sv) sv.onclick=async()=>{
    state.busy=true; render();
    const planning={}; for(const k of DK) if(c.jours[k].audrey) planning[k]=c.jours[k].audrey;
    const context=Object.assign({}, c, {planning, prepare_par: state.session.user.email, prepare_le: new Date().toISOString()});
    const {data:ex}=await sb.from('weeks').select('id,status').eq('week_start',z.week_start).maybeSingle();
    let error;
    if(ex && ex.status!=='brouillon'){ ({error}=await sb.from('weeks').update({context: Object.assign({}, curWeekCtx(ex.id), context)}).eq('id',ex.id)); }
    else { ({error}=await sb.from('weeks').upsert({week_start:z.week_start, status:'brouillon', context}, {onConflict:'week_start'})); }
    state.busy=false;
    if(error){ toast('Erreur : '+error.message); render(); return; }
    state.wiz=null; toast(ex&&ex.status!=='brouillon'?'Contexte mis à jour, Claude en tiendra compte':'Semaine préparée, à Claude de jouer'); await loadWeeks(); await loadWeekData();
  };
}

// ---------- Menu proposé par Claude : relecture jour par jour, puis semaine entière ----------
// Claude écrit sa proposition dans menu_proposals (content), le foyer répond dans la même ligne (review).
const PROT={viande_rouge:'Viande rouge',volaille:'Volaille',porc:'Porc',poisson:'Poisson',oeufs:'Œufs',vege:'Végétarien',charcuterie:'Charcuterie',mixte:'Mixte',aucune:'Sans protéine'};
const BASES={pates:'Pâtes',riz:'Riz',pdt:'Pommes de terre',pain:'Pain',semoule:'Semoule',legumineuses:'Légumineuses',autre:'Autre',sans:'Sans féculent'};
const WX={soleil:'sun',eclaircies:'suncloud',nuage:'cloud',pluie:'rain',orage:'bolt',neige:'snow',chaud:'sun'};
const AVIS={refait:'On refait',bof:'Bof',jamais:'Plus jamais'};
const NO_BAL=['restes','commande','exterieur','libre'];
const REM_CHIPS=['Trop long ce jour-là','Déjà mangé récemment','Pas envie','Plus simple','Un autre jour','Pas pour les enfants'];
function wxIcon(j){ if(j?.meteo_icon && WX[j.meteo_icon]) return WX[j.meteo_icon]; const t=String(j?.meteo||'').toLowerCase(); return /orage/.test(t)?'bolt':/neige/.test(t)?'snow':/pluie|averse|bruine/.test(t)?'rain':/soleil|ensoleill|beau|chaud/.test(t)?'sun':/éclairc|eclairc|variable/.test(t)?'suncloud':'cloud'; }
function guessProt(t){ t=t.toLowerCase(); return /saumon|poisson|cabillaud|thon|crevette|colin|lieu|merlu|sardine|truite|dorade/.test(t)?'poisson':/poulet|dinde|volaille|canard|escalope/.test(t)?'volaille':/bœuf|boeuf|steak|haché|hachis|bolognaise|burger|veau|agneau|bavette/.test(t)?'viande_rouge':/porc|lardon|saucisse|chipolata|filet mignon/.test(t)?'porc':/jambon|croque|raclette|charcut/.test(t)?'charcuterie':/œuf|oeuf|omelette|quiche|tortilla/.test(t)?'oeufs':/lentille|pois chiche|tofu|végé|vege|gratin de|soupe|velouté|risotto/.test(t)?'vege':'mixte'; }
function guessBase(t){ t=t.toLowerCase(); return /pâte|pate|spaghetti|lasagne|gnocchi|tagliatelle|penne|macaroni|nouille/.test(t)?'pates':/riz|risotto/.test(t)?'riz':/pomme de terre|patate|purée|puree|frite|hachis|dauphinois|rösti/.test(t)?'pdt':/pain|croque|sandwich|wrap|pizza|burger|tartine|galette/.test(t)?'pain':/semoule|couscous|boulgour|quinoa/.test(t)?'semoule':/lentille|pois chiche|haricot blanc|haricots rouges/.test(t)?'legumineuses':'autre'; }
const protOf=m=>m.proteine_type||guessProt(m.title||''), baseOf=m=>m.base||guessBase(m.title||'');
const cookedMeal=m=>!NO_COOK.includes(m.kind) && m.kind!=='restes';
const revDays=p=>p.review?.jours||{};
function propDay(k){ return addDays(state.propWeek.week_start, DK.indexOf(k)); }
function dayMeals(p,k){ const day=propDay(k); return (p.content?.repas||[]).filter(m=>m.day===day).sort(mealSort); }
function dayState(p,k){ if(!dayMeals(p,k).length) return 'na'; const r=revDays(p)[k]; return r?.ok===true?'ok':r?.ok===false?'ko':'todo'; }
function reviewedCount(p){ return DK.filter(k=>['ok','ko'].includes(dayState(p,k))).length; }
// Jours repris d'une version précédente (« Ça me va », sans remarque, plats inchangés) : on ne les remontre pas.
const isReprise=(p,k)=>!!revDays(p)[k]?.reprise;
function stepAfter(p,i){ for(let j=i+1;j<7;j++) if(!isReprise(p,DK[j])) return j; return 7; }
function stepBefore(p,i){ for(let j=i-1;j>=0;j--) if(!isReprise(p,DK[j])) return j; return -1; }
async function carryOver(p,w){
  if(p.status!=='proposee' || p.version<2 || p.review?.reprise) return;
  const {data:prev}=await sb.from('menu_proposals').select('version,content,review').eq('week_id',p.week_id).eq('version',p.version-1).maybeSingle();
  if(!prev) return;
  const key=m=>m.slot+'|'+String(m.title||'').trim().toLowerCase();
  const meals=(c,day)=>(c?.repas||[]).filter(m=>m.day===day);
  const jours=Object.assign({}, p.review?.jours);
  DK.forEach((k,i)=>{
    const pr=prev.review?.jours?.[k], day=addDays(w.week_start,i), now=meals(p.content,day), before=meals(prev.content,day);
    if(jours[k] || pr?.ok!==true || (pr.remarque||'').trim() || p.content?.jours?.[k]?.reponse) return;
    if(!now.length || now.length!==before.length || now.some(m=>m.modifie) || now.map(key).sort().join()!==before.map(key).sort().join()) return;
    jours[k]={ok:true, remarque:'', reprise:pr.reprise||prev.version, par:pr.par, le:pr.le};
  });
  p.review=Object.assign({}, p.review, {jours, reprise:true});
  const {error}=await sb.from('menu_proposals').update({review:p.review}).eq('id',p.id); if(error) toast('Erreur : '+error.message);
}
function firstUnreviewed(p){ if(p.status!=='proposee') return 7; const i=DK.findIndex(k=>dayState(p,k)==='todo'); return i<0?7:i; }
// Ce que l'on sait du plat : ce que Claude a mis dans la proposition (historique), complété par la table dishes et les avis de l'app.
function dishInfo(m){
  const t=String(m.title||'').toLowerCase(), d=state.dishFull.find(x=>x.name.toLowerCase()===t), h=m.historique||{};
  const av=state.avisAll.filter(f=>String(f.content.title||'').toLowerCase()===t).sort((a,b)=>b.created_at.localeCompare(a.created_at))[0];
  const avis=h.dernier_avis || (av?{avis:av.content.avis, par:prenom(av.content.par), le:av.created_at.slice(0,10)}:null);
  return {found:!!(d||h.last_served||h.times_served), rating:h.rating||d?.rating||null, last_served:h.last_served||d?.last_served||null, times_served:h.times_served??d?.times_served??0, notes:h.notes||d?.notes||null, avis};
}
function histText(d){
  if(!d.found) return `<b>Jamais servi</b> : une nouveauté pour ${esc(FOYER.enfants.join(' et '))}.`;
  const dot=x=>/\.$/.test(x)?x:x+'.';   // « 16 sept. » ne prend pas de second point
  let s=d.times_served?`Servi ${d.times_served===1?'une fois':d.times_served+' fois'}`:'Déjà au menu'; if(d.last_served) s+=`, la dernière le <b>${esc(fmtDate(d.last_served))}</b>`; s=dot(s);
  if(d.avis) s+=' '+dot(`${esc(d.avis.par||'Avis')} : « <b>${AVIS[d.avis.avis]||esc(d.avis.avis)}</b> »${d.avis.le?` le ${esc(fmtDate(d.avis.le))}`:''}`);
  else if(d.rating==='valide') s+=' Plat validé par la famille.'; else if(d.rating==='banni') s+=' Plat écarté.';
  if(d.notes) s+=` ${esc(d.notes)}`;
  return s;
}
// Points de vigilance, dans l'esprit des avertissements de l'échange de repas.
function propAlerts(m, ctx, all){
  const out=[]; if(!cookedMeal(m)) return out;
  const k=DKEYS[dayIdx(m.day)], mins=m.prep_minutes||0, cons=constraints(m.day,m.slot,ctx), d=dishInfo(m);
  if(cons.some(c=>c.kind==='sport') && mins>10) out.push(`${mins} min un ${m.slot} de sport : visez 10 min`);
  else if(cons.some(c=>c.kind==='seul') && mins>15) out.push(`${mins} min alors que ${FOYER.papa} est seul avec les enfants`);
  if(cons.some(c=>c.kind==='seul') && !d.found && m.kind!=='assemblage') out.push(`Plat à tester un soir où ${FOYER.papa} est seul`);
  if(mins>20 && !(ctx.cuisine_longue||[]).includes(k)) out.push(`${mins} min un jour sans cuisine longue`);
  if(d.rating==='banni') out.push('Plat noté « Plus jamais »');
  if(d.last_served && d.last_served>=addDays(m.day,-21) && d.last_served<m.day) out.push(`Déjà servi le ${fmtDate(d.last_served)}, il y a moins de 3 semaines`);
  if(d.avis?.avis==='bof' && d.avis.le && d.avis.le>=addDays(m.day,-42)) out.push(`Noté « Bof » le ${fmtDate(d.avis.le)}`);
  if(m.equilibre && !NO_BAL.includes(m.kind)){ const miss=['proteine','legume','feculent'].filter(x=>!m.equilibre[x]); if(miss.length) out.push('Il manque '+miss.map(x=>({proteine:'une protéine',legume:'un légume',feculent:'un féculent'})[x]).join(' et ')); }
  const pr=protOf(m);
  if(!['mixte','aucune','vege'].includes(pr) && all.some(x=>x!==m && cookedMeal(x) && Math.abs((new Date(x.day+'T00:00:00')-new Date(m.day+'T00:00:00'))/864e5)<=1 && protOf(x)===pr)) out.push(`${PROT[pr]} aussi la veille ou le lendemain`);
  return out;
}
function propBanner(){

  const today=todayIso();

  if(idx<0){ // prochaine semaine à venir, sinon la plus récente
    const up=state.weeks.map((w,i)=>[w,i]).filter(([w])=>w.week_start>today);
    idx = up.length ? up[up.length-1][1] : 0;
  }
  state.weekIdx=Math.max(0,idx);
}
async function loadWeekData(){
  const w=curWeek(), t=todayIso();
  const q=[
    sb.from('shopping_items').select('*').is('week_id',null).order('created_at'),
    sb.from('meals').select('*').gte('day',addDays(t,-2)).lte('day',addDays(t,9)).order('day'),
    sb.from('dishes').select('id,name,rating,kind'),
    sb.from('feedback_log').select('content,created_at').eq('kind','autre').gte('created_at',addDays(t,-10))
  ];
  if(w){ q.push(sb.from('meals').select('*').eq('week_id',w.id).order('day')); q.push(sb.from('shopping_items').select('*').eq('week_id',w.id).order('label')); }
  const r=await Promise.all(q);
  state.backlog=r[0].data||[]; state.near=r[1].data||[]; state.dishes=r[2].data||[];
  state.feedback=(r[3].data||[]).filter(f=>f.content?.type==='avis_repas');
  state.meals=w?(r[4].data||[]):[]; state.items=w?(r[5].data||[]):[];
  render();
}
async function checkMember(){
  const {data,error}=await sb.from('members').select('*').ilike('email',state.session.user.email).maybeSingle();
  state.member = (!error && data) ? data : false;
}
let channel=null;
function subscribe(){
  if(channel) return;
  channel=sb.channel('foyer')
    .on('postgres_changes',{event:'*',schema:'public',table:'shopping_items'},()=>loadWeekData())
    .on('postgres_changes',{event:'*',schema:'public',table:'meals'},()=>loadWeekData())
    .on('postgres_changes',{event:'*',schema:'public',table:'weeks'},async()=>{ await loadWeeks(); await loadWeekData(); })
    .on('postgres_changes',{event:'*',schema:'public',table:'menu_proposals'},()=>loadProposal())
    .subscribe();
}
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  await onSession(session);
  sb.auth.onAuthStateChange((_e,s)=>{ if((s&&!state.session)||(!s&&state.session)) onSession(s); });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&state.session&&state.member) { loadWeeks().then(loadWeekData); loadProposal(); } });
  // le « prochain repas » change avec l'heure : on rafraîchit l'accueil chaque minute
  setInterval(()=>{ if(state.tab==='accueil' && state.member && !state.wiz && !state.rev && !$('#sheet').classList.contains('on')) render(); }, 60000);
}
async function onSession(session){
  state.session=session; state.member=null; render();
  if(!session){ if(channel){ sb.removeChannel(channel); channel=null; } return; }
  await checkMember(); if(state.member===false){ render(); return; }
  await Promise.all([loadStatic(), loadWeeks(), loadProposal()]);
  await loadWeekData(); subscribe();
  if(location.hash==='#preparer'){ history.replaceState(null,'',location.pathname); openWizard(state.draft); }
  else if(location.hash==='#menu'){ history.replaceState(null,'',location.pathname); if(state.proposal) openReview(); else toast('Pas de menu proposé pour l\'instant'); }
}
boot();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
